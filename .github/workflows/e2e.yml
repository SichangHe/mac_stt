name: end-to-end

on:
  workflow_dispatch:
    inputs:
      runner:
        description: runner label
        default: macos-26
      script:
        description: scripts/e2e, scripts/e2e-features, or scripts/e2e-diarize
        default: scripts/e2e-features

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: run
        run: ${{ inputs.script }} e2e-out
      - name: retain
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ github.run_id }}
          path: e2e-out
          retention-days: 14
