name: probe-compute

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    strategy:
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: scripts/probe-compute 0.6b cpu 300
