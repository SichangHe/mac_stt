name: macOS feature evidence

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  automatable-apple-silicon-features:
    # 🧑 "Mac app builds on a current Mac toolchain and transcribes with separated speakers"
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: run real model features
        run: scripts/ci-acceptance ci-evidence
      - name: retain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-stt-macos-arm64-${{ github.run_id }}
          path: ci-evidence
          if-no-files-found: warn
          retention-days: 7
