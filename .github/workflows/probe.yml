name: probe
on:
  workflow_dispatch:
    inputs:
      runner:
        default: macos-14
permissions:
  contents: read
jobs:
  probe:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: environment
        run: |
          sw_vers; sysctl -n machdep.cpu.brand_string; system_profiler SPDisplaysDataType | head -20; xcodebuild -version; swift --version
      - name: decoder load on this macOS
        run: |
          B=https://huggingface.co/raymondchins/qwen3-asr-1.7b-coreml/resolve/09e2ce5602d570e9ffc97e45fb0d9c6dad33bafa/decoder.mlmodelc
          for f in analytics/coremldata.bin coremldata.bin metadata.json model.mil weights/weight.bin; do mkdir -p "d/decoder.mlmodelc/$(dirname $f)"; curl -fsSL --retry 3 -o "d/decoder.mlmodelc/$f" "$B/$f"; done
          perl -e 'alarm 600; exec @ARGV' swift scripts/probe/load.swift d/decoder.mlmodelc || echo "exit $?"
      - name: mlx on this runner
        run: |
          python3 -m venv v && . v/bin/activate && pip -q install mlx
          python - <<'PY'
          import mlx.core as mx, time
          print("device:", mx.default_device())
          a = mx.random.normal((4096, 4096)); mx.eval(a @ a)
          t = time.time()
          for _ in range(10): mx.eval(a @ a)
          print("10 matmuls 4096^3: %.3f s (%.1f GFLOPS)" % (time.time() - t, 10 * 2 * 4096**3 / (time.time() - t) / 1e9))
          PY
