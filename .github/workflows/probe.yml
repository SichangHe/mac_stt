name: probe toolchains

on:
  push:
    branches: [probe-toolchains]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: build with every installed Xcode
        run: |
          sw_vers
          uname -m
          mkdir probe
          for app in /Applications/Xcode*.app; do
            real=$(cd "$app" && pwd -P)
            echo "$real"
          done | sort -u > probe/xcodes
          cat probe/xcodes
          # 🧑 "GH Actions are failing ... get testing on a mac without having me do anything"
          while read -r xcode; do
            name=$(basename "$xcode" .app)
            export DEVELOPER_DIR="$xcode/Contents/Developer"
            swift_version=$(swift --version 2>&1)
            swift_major=$(printf '%s\n' "$swift_version" | sed -nE 's/.*Apple Swift version ([0-9]+).*/\1/p')
            if [ -n "$swift_major" ] && [ "$swift_major" -lt 6 ]; then
              printf '== %s\n%s\nRESULT %s SKIPPED (requires Swift 6)\n' "$name" "$swift_version" "$name" | tee -a probe/summary
              continue
            fi
            {
              echo "== $name"
              printf '%s\n' "$swift_version"
              if swift build -c release --scratch-path "build-$name" > "probe/$name.log" 2>&1 &&
                "build-$name/release/mac-stt" --help > "probe/$name.help" 2>&1; then
                echo "RESULT $name ok"
              else
                echo "RESULT $name FAILED"
                grep -n "error" "probe/$name.log" | head -40
                tail -n 40 "probe/$name.log"
              fi
            } 2>&1 | tee -a probe/summary
            cp "build-$name/Package.resolved" "probe/$name.resolved" 2>/dev/null || cp Package.resolved "probe/$name.resolved" 2>/dev/null || true
            rm -rf "build-$name"
          done < probe/xcodes
          grep RESULT probe/summary
          ! grep -q FAILED probe/summary
          grep -q 'RESULT .* ok' probe/summary
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-${{ matrix.os }}
          path: probe
          retention-days: 7
